<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSD — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #FAF8F3; --panel: #FFFFFF; --ink: #1C2420; --ink-soft: #5C6660; --ink-faint: #93998F;
    --line: #E4DFD3; --teal: #2B5F5C; --teal-soft: #E4EEEC; --coral: #C97B63; --coral-soft: #F6E7E1;
    --amber: #B9873E; --amber-soft: #F2E7D3; --sage: #5F8467; --sage-soft: #E4EBE1; --focus: #2B5F5C;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --bg: #171B19; --panel: #1E2422; --ink: #EDEAE2; --ink-soft: #A9B0A9; --ink-faint: #6D746D;
    --line: #303934; --teal: #6FADA6; --teal-soft: #24322F; --coral: #E0987F; --coral-soft: #33251F;
    --amber: #D6AE73; --amber-soft: #362C1C; --sage: #8FB595; --sage-soft: #263029; --focus: #6FADA6;
  } }
  :root[data-theme="dark"] {
    --bg: #171B19; --panel: #1E2422; --ink: #EDEAE2; --ink-soft: #A9B0A9; --ink-faint: #6D746D;
    --line: #303934; --teal: #6FADA6; --teal-soft: #24322F; --coral: #E0987F; --coral-soft: #33251F;
    --amber: #D6AE73; --amber-soft: #362C1C; --sage: #8FB595; --sage-soft: #263029; --focus: #6FADA6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
  h1, h2, h3, .display { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 560; letter-spacing: -0.01em; margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--teal); }

  /* Auth screen */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 360px; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; text-align: center; }
  .auth-mark { width: 34px; height: 34px; margin: 0 auto 14px auto; }
  .auth-card h1 { font-size: 20px; margin-bottom: 6px; }
  .auth-card p { color: var(--ink-soft); font-size: 13px; margin-bottom: 20px; }
  .auth-card input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); margin-bottom: 12px; text-align: center; }
  .auth-status { font-size: 12.5px; color: var(--ink-soft); margin-top: 14px; min-height: 16px; }
  .auth-status.error { color: var(--coral); }

  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-name { font-family: "Fraunces", serif; font-weight: 560; font-size: 17px; }
  .brand-sub { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
  nav.primary-nav { display: flex; flex-direction: column; gap: 2px; }
  .search-row { position: relative; padding: 0 8px; }
  .search-box { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--bg); }
  .search-box svg { width: 15px; height: 15px; color: var(--ink-faint); flex-shrink: 0; }
  .search-box input { border: none; background: none; width: 100%; font-size: 12.5px; color: var(--ink); }
  .search-filters { display: flex; flex-direction: column; gap: 6px; padding: 8px; margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .search-filters select { width: 100%; font-size: 12px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .search-results { position: absolute; top: calc(100% + 4px); left: 8px; right: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(20,24,22,0.14); max-height: 360px; overflow-y: auto; z-index: 40; }
  .search-group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); padding: 8px 12px 4px 12px; }
  .search-result { display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer; padding: 8px 12px; font-size: 12.5px; color: var(--ink); border-bottom: 1px solid var(--line); }
  .search-result:hover { background: var(--teal-soft); }
  .search-result:last-child { border-bottom: none; }
  .search-result .sr-meta { color: var(--ink-faint); font-size: 11px; margin-top: 1px; }
  .search-empty { padding: 14px 12px; font-size: 12px; color: var(--ink-faint); text-align: center; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: var(--ink-soft); text-decoration: none; cursor: pointer; border: none; background: none; text-align: left; width: 100%; font-size: 13.5px; }
  .nav-item:hover { background: var(--teal-soft); color: var(--ink); }
  .nav-item.active { background: var(--teal-soft); color: var(--teal); font-weight: 500; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar-foot { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }
  .notif-row { position: relative; }
  .notif-btn { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px; cursor: pointer; color: var(--ink-soft); font-size: 12.5px; position: relative; }
  .notif-btn:hover { background: var(--teal-soft); color: var(--ink); }
  .notif-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .notif-badge { position: absolute; top: 4px; left: 20px; background: var(--coral); color: #fff; font-size: 9.5px; font-weight: 600; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .notif-panel { position: absolute; bottom: calc(100% + 8px); left: 0; width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(20,24,22,0.14); max-height: 320px; overflow-y: auto; z-index: 30; }
  .notif-item { display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink); }
  .notif-item:hover { background: var(--teal-soft); }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--coral-soft); }
  .notif-item .notif-meta { color: var(--ink-faint); font-size: 11px; margin-top: 2px; }
  .notif-empty { padding: 16px 12px; color: var(--ink-faint); font-size: 12px; text-align: center; }
  .notif-panel-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--ink-soft); }
  .identity-box { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
  .identity-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #fff; flex-shrink: 0; }
  .identity-info { flex: 1; min-width: 0; }
  .identity-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .identity-role { font-size: 10.5px; color: var(--ink-faint); text-transform: capitalize; }
  .signout-btn { border: none; background: none; color: var(--ink-faint); cursor: pointer; font-size: 11px; }
  .signout-btn:hover { color: var(--coral); }

  .main { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 32px 0 32px; }
  .page-title { font-size: 24px; }
  .page-sub { color: var(--ink-soft); font-size: 13px; margin-top: 3px; }
  .view-toggle { display: flex; gap: 8px; align-items: center; }
  .scope-btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; cursor: pointer; color: var(--ink-soft); font-size: 12.5px; }
  .scope-btn:first-child { border-radius: 7px 0 0 7px; }
  .scope-btn:last-child { border-radius: 0 7px 7px 0; }
  .scope-btn + .scope-btn { border-left: none; }
  .scope-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .content { padding: 20px 32px 48px 32px; }
  .banner { background: var(--amber-soft); border: 1px solid var(--amber); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 20px; display: flex; gap: 8px; align-items: flex-start; }
  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat-num { font-family: "Fraunces", serif; font-size: 28px; font-weight: 560; }
  .stat-label { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: stretch; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .panel h3 { font-size: 15px; margin-bottom: 14px; }
  .arc-wrap { display: flex; align-items: center; gap: 20px; }
  .arc-num { font-family: "Fraunces", serif; font-size: 34px; font-weight: 560; }
  .arc-caption { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; max-width: 180px; }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list-row:last-child { border-bottom: none; }
  .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .tag-team-education { background: var(--teal-soft); color: var(--teal); }
  .tag-team-planning { background: var(--coral-soft); color: var(--coral); }
  .tag-team-delight { background: var(--sage-soft); color: var(--sage); }
  .tag-team-marketing { background: var(--amber-soft); color: var(--amber); }
  .tag-team-corporate { background: var(--line); color: var(--ink-soft); }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-soft); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-dot.planning { background: var(--ink-faint); }
  .status-dot.active { background: var(--teal); }
  .status-dot.review { background: var(--amber); }
  .status-dot.launched { background: var(--sage); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  select { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 7px 10px; color: var(--ink); }
  .btn { border: 1px solid var(--teal); background: var(--teal); color: #fff; padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .btn:hover { opacity: 0.92; }
  .btn-ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .btn-ghost:hover { background: var(--teal-soft); }
  .btn-text { border: none; background: none; color: var(--teal); cursor: pointer; font-size: 13px; padding: 4px; }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .project-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .15s; }
  .project-card:hover { border-color: var(--teal); }
  .project-card.static { cursor: default; }
  .project-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .project-name { font-family: "Fraunces", serif; font-size: 16px; font-weight: 560; margin-bottom: 3px; }
  .project-client { font-size: 12px; color: var(--ink-soft); }
  .progress-bar { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 8px 0; }
  .progress-fill { height: 100%; background: var(--teal); border-radius: 4px; }
  .project-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-faint); }
  .board-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .board-col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 120px; transition: background-color .12s, border-color .12s; }
  .board-col.drag-over { background: var(--teal-soft); border-color: var(--teal); }
  .task-card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; margin-bottom: 8px; font-size: 12.5px; cursor: grab; }
  .task-card.dragging { opacity: 0.4; }
  .board-col h4 { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; margin: 0 0 10px 0; display: flex; justify-content: space-between; }
  .task-title { margin-bottom: 6px; }
  .task-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .task-meta select { font-size: 11px; padding: 3px 5px; border-radius: 5px; }
  .assignee-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-soft); }
  .task-reassign-select { border: none; background: none; padding: 0; font-size: 11px; color: var(--ink-soft); max-width: 78px; }
  .due-overdue { color: var(--coral); font-weight: 500; }
  .due-red { color: var(--coral); font-weight: 600; }
  .due-yellow { color: var(--amber); font-weight: 600; }
  .due-blue { color: var(--teal); font-weight: 500; }
  .add-task-row { margin-top: 6px; }
  .add-task-row input, .add-task-row select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; background: var(--panel); }
  .timeline-row { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .timeline-row:last-child { border-bottom: none; }
  .timeline-track { position: relative; height: 22px; background: var(--bg); border-radius: 20px; }
  .timeline-bar { position: absolute; top: 0; height: 100%; border-radius: 20px; display: flex; align-items: center; padding: 0 10px; font-size: 10.5px; color: #fff; white-space: nowrap; overflow: hidden; }
  .axis-row { display: grid; grid-template-columns: 190px 1fr; margin-bottom: 8px; }
  .axis-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); background: none; border: none; cursor: pointer; font-size: 13px; margin-bottom: 10px; padding: 0; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .client-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: var(--coral-soft); color: var(--coral); font-size: 12px; margin-bottom: 16px; }

  .detail-backdrop { position: fixed; inset: 0; background: rgba(20,24,22,0.28); display: flex; justify-content: flex-end; z-index: 20; }
  .detail-panel { width: 480px; max-width: 92vw; height: 100%; background: var(--panel); border-left: 1px solid var(--line); padding: 22px 26px 0 26px; overflow-y: auto; box-shadow: -10px 0 28px rgba(20,24,22,0.10); animation: slideInPanel .16s ease-out; }
  @keyframes slideInPanel { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .detail-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .icon-btn { border: none; background: none; cursor: pointer; color: var(--ink-soft); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  .icon-btn:hover { background: var(--teal-soft); color: var(--ink); }
  .icon-btn svg { width: 15px; height: 15px; }
  .complete-check { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; background: var(--panel); cursor: pointer; font-size: 12.5px; color: var(--ink-soft); }
  .complete-check.done { background: var(--sage-soft); border-color: var(--sage); color: var(--sage); }
  .complete-check input { display: none; }
  .detail-title { font-family: "Fraunces", serif; font-size: 21px; font-weight: 560; margin: 4px 0 18px 0; line-height: 1.3; }
  .field-table { border-top: 1px solid var(--line); margin-bottom: 20px; }
  .field-table-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .field-table-row .ft-label { color: var(--ink-soft); font-size: 12.5px; }
  .field-table-row select, .field-table-row input { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; width: 100%; }
  .field-table-row select:hover, .field-table-row input:hover { border-color: var(--line); background: var(--bg); }
  .ft-assignee { display: flex; align-items: center; gap: 8px; }
  .section-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .subtask-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .subtask-row input[type="checkbox"] { width: 15px; height: 15px; }
  .subtask-row.done span { text-decoration: line-through; color: var(--ink-faint); }
  .subtask-assignee-select { border: none; background: none; font-size: 11px; color: var(--ink-soft); max-width: 90px; }
  .subtask-add { display: flex; gap: 6px; margin-top: 4px; }
  .subtask-add input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); }
  .tabs-row { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tab-btn { border: none; background: none; cursor: pointer; padding: 8px 0; font-size: 13px; color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--teal); font-weight: 500; }
  .activity-row { display: flex; gap: 8px; padding: 7px 0; font-size: 12.5px; color: var(--ink-soft); align-items: flex-start; }
  .activity-row .identity-dot { width: 20px; height: 20px; font-size: 9px; flex-shrink: 0; }
  .comment-row { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .comment-row:last-child { border-bottom: none; }
  .comment-body { flex: 1; min-width: 0; }
  .comment-mention { color: var(--teal); font-weight: 500; }
  .file-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .file-row:last-child { border-bottom: none; }
  .file-row a { color: var(--ink); text-decoration: none; }
  .file-row a:hover { color: var(--teal); text-decoration: underline; }
  .file-meta { color: var(--ink-faint); font-size: 11px; }
  .comment-input-bar { position: sticky; bottom: 0; background: var(--panel); padding: 12px 0 20px 0; margin-top: 6px; }
  .mention-dropdown { position: absolute; z-index: 25; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 16px rgba(20,24,22,0.14); width: 200px; overflow: hidden; }
  .mention-option { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; font-size: 12.5px; }
  .mention-option:hover, .mention-option.active { background: var(--teal-soft); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,24,22,0.35); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: var(--panel); border-radius: 14px; padding: 24px; width: 380px; border: 1px solid var(--line); max-height: 88vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: var(--bg); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }

  /* Resourcing + time */
  .res-period { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
  .res-stack { display: flex; flex-direction: column; gap: 18px; }
  .res-note { font-size: 12.5px; color: var(--ink-soft); }
  .res-flag-over { color: var(--coral); font-weight: 500; }
  .table-scroll { overflow-x: auto; }
  .res-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .res-table th { text-align: left; font-weight: 500; color: var(--ink-soft); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .res-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .res-table tr:last-child td { border-bottom: none; }
  .res-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .res-table input, .res-table select { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; width: 72px; text-align: right; }
  .res-table input:hover, .res-table input:focus, .res-table select:hover { border-color: var(--line); background: var(--bg); }
  .res-table a { text-decoration: none; color: var(--ink); font-weight: 500; }
  .res-table a:hover { color: var(--teal); }
  .alloc-row { display: grid; grid-template-columns: 140px 1fr 200px; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .alloc-bar { position: relative; height: 10px; background: var(--line); border-radius: 5px; }
  .alloc-fill { height: 100%; border-radius: 5px; }
  .alloc-target { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
  .alloc-num { font-family: "Fraunces", serif; font-size: 22px; font-weight: 560; }
  .inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .inline-form input, .inline-form select { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--bg); }
  .res-textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: var(--bg); resize: vertical; }
  .res-notes-read { white-space: pre-wrap; font-size: 13px; margin-bottom: 12px; }
  @media (max-width: 760px) { .alloc-row { grid-template-columns: 1fr; gap: 6px; } .alloc-row > div:last-child { text-align: left !important; } }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 12px 16px; overflow-x: auto; }
    nav.primary-nav { flex-direction: row; }
    .sidebar-foot { display: none; }
    .stat-row, .board-cols { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .content { padding: 16px; }
  }
  [hidden] { display: none !important; }
</style>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://yxevnyyzezfdsbclhvvp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4ZXZueXl6ZXpmZHNiY2xodnZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NTAyNzIsImV4cCI6MjEwNTEyNjI3Mn0.lzNi8WSV1e7PgumfdrDZtd3OmPs9J8CP1PXftBu0OFQ";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const TEAMS = ["Education", "Planning Center", "Delight", "Marketing", "Corporate"];
  const TEAM_CLASS = { "Education": "tag-team-education", "Planning Center": "tag-team-planning", "Delight": "tag-team-delight", "Marketing": "tag-team-marketing", "Corporate": "tag-team-corporate" };
  const STATUSES = ["planning", "active", "review", "launched"];
  const TASK_COLS = [{ key: "todo", label: "To do" }, { key: "doing", label: "In progress" }, { key: "review", label: "Review" }, { key: "done", label: "Done" }];
  const STATUS_LABEL = { todo: "To do", doing: "In progress", review: "Review", done: "Done" };

  let me = null; // { id, email, name, team, role }
  let bootedUserId = null; // guards against re-booting on token-refresh SIGNED_IN events
  let state = {
    view: "dashboard",
    projects: [], tasks: [], people: [], clients: [], portfolios: [], openSubtasks: [], allDependencies: [], completionHistory: [],
    notifications: [], progressMap: {},
    selectedProjectId: null, selectedPortfolioId: null, teamFilter: "all",
    dashboardScope: "dsd", dashboardTeam: null,
    timeEntries: [], resMeetings: [], resItems: [], resFlags: [], resTotalsCache: {},
    resBu: null, resMeetingDate: null, timeWeek: null,
    holidays: [], timeOff: [], resCapCache: {}, resMonth: null
  };
  let channels = {};

  const el = (sel) => document.querySelector(sel);
  const content = () => el("#content");

  function fmtDate(d) {
    if (!d) return "—";
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function isOverdue(dueDate, status) {
    if (status === "done" || !dueDate) return false;
    return new Date(dueDate + "T00:00:00") < new Date(new Date().toDateString());
  }
  function dueDateClass(dueDate, status) {
    if (!dueDate || status === "done") return "";
    const today = new Date(new Date().toDateString());
    const due = new Date(dueDate + "T00:00:00");
    const weekAhead = new Date(today); weekAhead.setDate(today.getDate() + 7);
    if (due < today) return "due-red";
    if (due <= weekAhead) return "due-yellow";
    return "due-blue";
  }
  function initials(name) {
    if (!name) return "?";
    return name.trim().split(/\s+/).map(p => p[0]).join("").slice(0, 2).toUpperCase();
  }
  function colorForName(name) {
    const palette = ["#2B5F5C", "#C97B63", "#5F8467", "#B9873E", "#6E7FA8", "#A0668C"];
    let h = 0;
    for (let i = 0; i < (name || "").length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
    return palette[h % palette.length];
  }
  function escapeHtml(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function highlightMentions(text) {
    let html = escapeHtml(text);
    state.people.forEach(p => { const marker = "@" + escapeHtml(p.name); html = html.split(marker).join(`<span class="comment-mention">${marker}</span>`); });
    return html;
  }
  function personById(id) { return state.people.find(p => p.id === id) || state.clients.find(p => p.id === id); }
  function personIdByName(name) { const p = state.people.find(p => p.name === name); return p ? p.id : null; }
  function personByName(name) { return state.people.find(p => p.name === name); }
  function projectProgress(projectId) { return state.progressMap[projectId] || 0; }

  // =========================================================
  // AUTH
  // =========================================================
  el("#auth-send").addEventListener("click", async () => {
    const email = el("#auth-email").value.trim();
    const statusEl = el("#auth-status");
    if (!email) return;
    statusEl.className = "auth-status";
    statusEl.textContent = "Sending…";
    try {
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
      if (error) throw error;
      statusEl.textContent = "Check your email for a sign-in link.";
    } catch (e) {
      statusEl.className = "auth-status error";
      statusEl.textContent = e.message || "Couldn't send the link. Try again.";
    }
  });

  async function handleSignedIn(session) {
    let profile = null;
    for (let i = 0; i < 6; i++) {
      const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (data) { profile = data; break; }
      await new Promise(r => setTimeout(r, 500));
    }
    if (!profile) {
      el("#auth-status").className = "auth-status error";
      el("#auth-status").textContent = "Signed in, but your profile isn't ready yet — refresh in a moment.";
      return;
    }
    me = { id: profile.id, email: profile.email, name: profile.name, team: profile.team, role: profile.role, isAdmin: !!profile.is_admin, resBu: profile.resourcing_bu || null };
    el("#auth-wrap").hidden = true;
    if (bootedUserId === me.id) {
      // Already booted this session — this SIGNED_IN event is just Supabase
      // re-validating the token (e.g. after switching browser tabs), not a
      // real new sign-in. Don't reset the current view.
      el(me.role === "client" ? "#client-root" : "#app-root").hidden = false;
      return;
    }
    bootedUserId = me.id;
    if (me.role === "client") {
      bootClient();
    } else {
      bootStaff();
    }
  }

  function handleSignedOut() {
    me = null;
    bootedUserId = null;
    Object.values(channels).forEach(ch => sb.removeChannel(ch));
    channels = {};
    el("#app-root").hidden = true;
    el("#client-root").hidden = true;
    el("#auth-wrap").hidden = false;
    el("#auth-status").textContent = "";
    el("#auth-email").value = "";
  }

  el("#signout-btn").addEventListener("click", () => sb.auth.signOut());
  el("#client-signout-btn").addEventListener("click", () => sb.auth.signOut());

  sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" && session) handleSignedIn(session);
    else if (event === "SIGNED_OUT") handleSignedOut();
  });
  sb.auth.getSession().then(({ data }) => { if (data.session) handleSignedIn(data.session); });

  // =========================================================
  // CLIENT-ONLY SHELL
  // =========================================================
  async function bootClient() {
    el("#client-root").hidden = false;
    el("#client-identity-name").textContent = me.name;
    el("#client-identity-dot").textContent = initials(me.name);
    el("#client-identity-dot").style.background = colorForName(me.name);

    async function loadAndRenderClientProjects() {
      const { data: projects } = await sb.from("projects").select("*").order("start_date");
      const { data: progress } = await sb.from("project_progress").select("*");
      const progMap = {};
      (progress || []).forEach(r => progMap[r.project_id] = r.progress_percent);
      const wrap = el("#client-content");
      if (!projects || !projects.length) {
        wrap.innerHTML = `<div class="empty-state">No projects have been shared with you yet.</div>`;
        return;
      }
      wrap.innerHTML = `<div class="projects-grid">${projects.map(p => `
        <div class="project-card static">
          <div class="project-card-top"><div><div class="project-name">${escapeHtml(p.name)}</div></div></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${progMap[p.id]||0}%"></div></div>
          <div class="project-meta">
            <span class="status-pill"><span class="status-dot ${p.status}"></span>${p.status}</span>
            <span>${fmtDate(p.start_date)} – ${fmtDate(p.end_date)}</span>
          </div>
        </div>`).join("")}</div>`;
    }
    loadAndRenderClientProjects();
    channels.clientProjects = sb.channel("client-projects")
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, loadAndRenderClientProjects)
      .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, loadAndRenderClientProjects)
      .subscribe();
  }

  // =========================================================
  // STAFF APP BOOT
  // =========================================================
  async function bootStaff() {
    el("#app-root").hidden = false;
    el("#identity-name").textContent = me.name;
    el("#identity-role").textContent = me.role;
    el("#identity-dot").textContent = initials(me.name);
    el("#identity-dot").style.background = colorForName(me.name);

    setView("dashboard");

    await Promise.all([loadPeople(), loadClients(), loadPortfolios(), loadProjects(), loadTasks(), loadProgress(), loadOpenSubtasks(), loadDependencies(), loadCompletionHistory()]);
    render();
    populateSearchAssigneeOptions();
    subscribeRealtime();
    subscribeNotifications();
    bootResourcing();
  }

  async function loadPeople() {
    const { data } = await sb.from("profiles").select("*").eq("role", "staff").order("name");
    state.people = data || [];
  }
  async function loadClients() {
    const { data } = await sb.from("profiles").select("*").eq("role", "client").order("name");
    state.clients = data || [];
  }
  async function loadPortfolios() {
    const { data } = await sb.from("portfolios").select("*, project_portfolios(project_id)").order("name");
    state.portfolios = (data || []).map(f => ({ id: f.id, name: f.name }));
  }
  async function loadProjects() {
    const { data: projects } = await sb.from("projects").select("*").order("start_date");
    const { data: pf } = await sb.from("project_portfolios").select("*");
    const { data: pc } = await sb.from("project_clients").select("*, profiles(name)");
    state.projects = (projects || []).map(p => ({
      id: p.id, name: p.name, team: p.team, client: p.client_company, status: p.status,
      startDate: p.start_date, endDate: p.end_date, visibleToClient: p.share_with_client,
      budget: p.budget, budgetSpent: p.budget_spent || 0,
      businessUnit: p.business_unit || null, plannedHours: p.planned_hours != null ? Number(p.planned_hours) : null, priority: p.priority,
      isUnplanned: !!p.is_unplanned, unplannedStatus: p.unplanned_status, requestedOn: p.requested_on, swappedFor: p.swapped_for,
      requestedBy: p.requested_by, requestDetails: p.request_details, requestDeadline: p.request_deadline, requestUrgent: !!p.request_urgent,
      portfolioIds: (pf || []).filter(r => r.project_id === p.id).map(r => r.portfolio_id),
      clientIds: (pc || []).filter(r => r.project_id === p.id).map(r => r.client_id)
    }));
  }
  async function loadTasks() {
    const { data: tasks } = await sb.from("tasks").select("*");
    const { data: tp } = await sb.from("task_projects").select("*");
    state.tasks = (tasks || []).map(t => ({
      id: t.id, title: t.title, description: t.description, status: t.status,
      assignee: t.assignee_id ? (personById(t.assignee_id) || {}).name : "",
      assigneeId: t.assignee_id, dueDate: t.due_date, estimatedHours: t.estimated_hours,
      projectIds: (tp || []).filter(r => r.task_id === t.id).map(r => r.project_id)
    }));
  }
  async function loadProgress() {
    const { data } = await sb.from("project_progress").select("*");
    const map = {};
    (data || []).forEach(r => map[r.project_id] = r.progress_percent);
    state.progressMap = map;
  }
  async function loadOpenSubtasks() {
    const { data } = await sb.from("subtasks").select("assignee_id, estimated_hours").eq("done", false);
    // Resolved to names at render time (via personById), since state.people
    // may still be loading concurrently with this call.
    state.openSubtasks = data || [];
  }
  async function loadDependencies() {
    const { data } = await sb.from("task_dependencies").select("*");
    state.allDependencies = data || [];
  }
  async function loadCompletionHistory() {
    const since = new Date(); since.setDate(since.getDate() - 30); since.setHours(0,0,0,0);
    const { data } = await sb.from("task_activity").select("task_id, created_at").eq("kind", "activity").eq("text", "changed the status to Done").gte("created_at", since.toISOString());
    state.completionHistory = (data || []).map(r => ({ taskId: r.task_id, createdAt: r.created_at }));
  }

  function subscribeRealtime() {
    Object.values(channels).forEach(ch => sb.removeChannel(ch));
    channels = {};
    const refetchAll = async () => { await Promise.all([loadPeople(), loadClients(), loadPortfolios(), loadProjects(), loadTasks(), loadProgress(), loadOpenSubtasks(), loadDependencies(), loadCompletionHistory()]); render(); populateSearchAssigneeOptions(); };
    channels.main = sb.channel("staff-main")
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, refetchAll)
      .on("postgres_changes", { event: "*", schema: "public", table: "portfolios" }, refetchAll)
      .on("postgres_changes", { event: "*", schema: "public", table: "project_portfolios" }, refetchAll)
      .on("postgres_changes", { event: "*", schema: "public", table: "project_clients" }, refetchAll)
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, refetchAll)
      .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, refetchAll)
      .on("postgres_changes", { event: "*", schema: "public", table: "task_projects" }, refetchAll)

  let searchFilters = { type: "all", team: "all", status: "all", assignee: "all" };

  function populateSearchAssigneeOptions() {
    const sel = el("#sf-assignee");
    if (!sel) return;
    const current = searchFilters.assignee;
    sel.innerHTML = `<option value="all">All people</option>` + state.people.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("");
    sel.value = state.people.some(p => p.name === current) ? current : "all";
  }

  function computeSearchMatches(query) {
    const q = query.trim().toLowerCase();
    let projects = state.projects;
    let tasks = state.tasks;
    if (searchFilters.team !== "all") {
      projects = projects.filter(p => p.team === searchFilters.team);
      tasks = tasks.filter(t => { const person = personByName(t.assignee); return person && person.team === searchFilters.team; });
    }
    if (searchFilters.status !== "all") {
      tasks = tasks.filter(t => t.status === searchFilters.status);
    }
    if (searchFilters.assignee !== "all") {
      tasks = tasks.filter(t => t.assignee === searchFilters.assignee);
    }
    if (q) {
      projects = projects.filter(p => p.name.toLowerCase().includes(q));
      tasks = tasks.filter(t => t.title.toLowerCase().includes(q));
    }
    if (searchFilters.type === "projects") tasks = [];
    if (searchFilters.type === "tasks") projects = [];
    return { projects: projects.slice(0, 6), tasks: tasks.slice(0, 8) };
  }

  function renderSearchResults(query) {
    const row = el("#search-row");
    let panel = document.getElementById("search-results");
    const hasQuery = query.trim() !== "";
    const hasFilter = searchFilters.type !== "all" || searchFilters.team !== "all" || searchFilters.status !== "all" || searchFilters.assignee !== "all";
    if (!hasQuery && !hasFilter) { if (panel) panel.remove(); return; }
    const { projects: matchedProjects, tasks: matchedTasks } = computeSearchMatches(query);
    if (!panel) { panel = document.createElement("div"); panel.className = "search-results"; panel.id = "search-results"; row.appendChild(panel); }
    if (!matchedProjects.length && !matchedTasks.length) {
      panel.innerHTML = `<div class="search-empty">No matches${hasQuery ? ` for "${escapeHtml(query)}"` : " for these filters"}</div>`;
      return;
    }
    panel.innerHTML = `
      ${matchedProjects.length ? `<div class="search-group-label">Projects</div>${matchedProjects.map(p => `
        <button class="search-result" data-action="goto-project" data-id="${p.id}">${escapeHtml(p.name)}<div class="sr-meta">${p.team}</div></button>
      `).join("")}` : ""}
      ${matchedTasks.length ? `<div class="search-group-label">Tasks</div>${matchedTasks.map(t => {
        const proj = projectById(t.projectIds[0]);
        return `<button class="search-result" data-action="goto-task" data-id="${t.id}" data-project="${t.projectIds[0]||''}">${escapeHtml(t.title)}<div class="sr-meta">${proj ? escapeHtml(proj.name) : ''}${t.assignee ? ' · ' + escapeHtml(t.assignee) : ''}</div></button>`;
      }).join("")}` : ""}
    `;
    panel.querySelectorAll('[data-action="goto-project"]').forEach(btn => btn.addEventListener("click", () => {
      closeSearchResults();
      state.selectedProjectId = btn.dataset.id;
      render();
    }));
    panel.querySelectorAll('[data-action="goto-task"]').forEach(btn => btn.addEventListener("click", () => {
      closeSearchResults();
      state.selectedProjectId = btn.dataset.project || null;
      render();
      openTaskDetail(btn.dataset.id);
    }));
  }

    const panel = document.getElementById("search-results");

  function computeProjectRisk(p) {
    const reasons = [];
    const projTasks = state.tasks.filter(t => t.projectIds.includes(p.id));
    const overdueCount = projTasks.filter(t => isOverdue(t.dueDate, t.status)).length;
    if (overdueCount) reasons.push(`${overdueCount} overdue task${overdueCount===1?'':'s'}`);
    if (p.status !== "launched" && p.startDate && p.endDate) {
      const start = new Date(p.startDate), end = new Date(p.endDate), today = new Date();
      if (end > start) {
        const elapsedPct = Math.max(0, Math.min(100, Math.round((today-start)/(end-start)*100)));
        const completionPct = projectProgress(p.id);
        if (elapsedPct > 20 && elapsedPct - completionPct > 25) reasons.push(`${elapsedPct}% of timeline used, only ${completionPct}% done`);
      }
    }
    if (p.budget && p.budgetSpent > p.budget * 0.9) reasons.push(`Budget ${Math.round(p.budgetSpent/p.budget*100)}% spent`);
    return reasons;
  }

  function renderDashboard() {
    const scope = state.dashboardScope;
    if (scope === "team" && !state.dashboardTeam) state.dashboardTeam = me.team || TEAMS[0];

    el("#page-title").textContent = "Dashboard";
    el("#page-sub").textContent = scope === "dsd" ? "Everything launching across DSD" : scope === "team" ? `Team stats — ${state.dashboardTeam}` : `Your stats, ${me.name}`;

    const wrap = el("#team-filter-wrap");
    wrap.style.display = "flex";
    wrap.innerHTML = `
      <div class="scope-toggle" style="display:flex;">
        <button class="scope-btn ${scope==='dsd'?'active':''}" data-scope="dsd">DSD</button>
        <button class="scope-btn ${scope==='team'?'active':''}" data-scope="team">Team</button>
        <button class="scope-btn ${scope==='me'?'active':''}" data-scope="me">Me</button>
      </div>
      ${scope === "team" ? `<select id="dash-team-select" style="margin-left:10px;">${TEAMS.map(t => `<option value="${t}" ${t===state.dashboardTeam?'selected':''}>${t}</option>`).join("")}</select>` : ""}
    `;
    wrap.querySelectorAll(".scope-btn").forEach(btn => btn.addEventListener("click", () => { state.dashboardScope = btn.dataset.scope; render(); }));
    const teamSelect = el("#dash-team-select");
    if (teamSelect) teamSelect.addEventListener("change", (e) => { state.dashboardTeam = e.target.value; render(); });

    // ---- filter data to the selected scope ----
    let projects = state.projects;
    let tasks = state.tasks;
    let subtasksForWorkload = state.openSubtasks;
    let unassignedTasks = [];
    if (scope === "team") {
      projects = state.projects.filter(p => p.team === state.dashboardTeam);
      tasks = state.tasks.filter(t => { const p = personByName(t.assignee); return p && p.team === state.dashboardTeam; });
      subtasksForWorkload = state.openSubtasks.filter(s => { const p = personById(s.assignee_id); return p && p.team === state.dashboardTeam; });
      unassignedTasks = state.tasks.filter(t => !t.assignee && t.status !== "done" && t.projectIds.some(pid => { const proj = projectById(pid); return proj && proj.team === state.dashboardTeam; }));
    } else if (scope === "me") {
      tasks = state.tasks.filter(t => t.assignee === me.name);
      const myProjectIds = new Set(tasks.flatMap(t => t.projectIds));
      projects = state.projects.filter(p => myProjectIds.has(p.id));
      subtasksForWorkload = state.openSubtasks.filter(s => s.assignee_id === me.id);
    } else {
      unassignedTasks = state.tasks.filter(t => !t.assignee && t.status !== "done");
    }

    const activeProjects = projects.filter(p => p.status !== "launched");
    const now = new Date(); now.setHours(0,0,0,0);
    const weekAhead = new Date(now); weekAhead.setDate(now.getDate() + 7);
    const twoWeeksAhead = new Date(now); twoWeeksAhead.setDate(now.getDate() + 14);
    const dueThisWeek = tasks.filter(t => t.status !== "done" && t.dueDate && new Date(t.dueDate) >= now && new Date(t.dueDate) <= weekAhead);
    const overdue = tasks.filter(t => isOverdue(t.dueDate, t.status));
    const overallProgress = projects.length ? Math.round(projects.reduce((sum, p) => sum + projectProgress(p.id), 0) / projects.length) : 0;

    const workload = {};
    tasks.filter(t => t.status !== "done").forEach(t => { const name = t.assignee || "Unassigned"; workload[name] = (workload[name] || 0) + (Number(t.estimatedHours) || 0); });
    subtasksForWorkload.forEach(s => { const name = s.assignee_id ? ((personById(s.assignee_id) || {}).name || "Unassigned") : "Unassigned"; workload[name] = (workload[name] || 0) + (Number(s.estimated_hours) || 0); });
    const workloadRows = Object.entries(workload).sort((a,b) => b[1]-a[1]).slice(0, 6);
    const pastDeadlines = overdue.slice().sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate)).slice(0, 6);
    const upcomingDeadlines = dueThisWeek.slice().sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate)).slice(0, 6);
    const statusCounts = {};
    TASK_COLS.forEach(c => { statusCounts[c.key] = tasks.filter(t => t.status === c.key).length; });
    const circumference = 2 * Math.PI * 48;
    const offset = circumference * (1 - overallProgress / 100);
    const progressCaption = scope === "dsd" ? "average completion across all active projects" : scope === "team" ? `average completion across ${state.dashboardTeam}'s projects` : "average completion across your projects";
    const workloadTitle = scope === "me" ? "Your open hours" : "Team workload (open hours)";

    const blockedTasks = tasks.filter(t => t.status !== "done" && state.allDependencies.some(d => d.task_id === t.id && (state.tasks.find(x => x.id === d.depends_on_task_id) || {}).status !== "done"));
    const riskyProjects = projects.map(p => ({ project: p, reasons: computeProjectRisk(p) })).filter(x => x.reasons.length).slice(0, 6);
    const launchingSoon = projects.filter(p => p.status !== "launched" && p.endDate && new Date(p.endDate) <= twoWeeksAhead).sort((a,b) => new Date(a.endDate) - new Date(b.endDate)).slice(0, 6);

    const scopedTaskIds = new Set(tasks.map(t => t.id));
    const chartDays = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setDate(now.getDate() - i); chartDays.push(d); }
    const dayCounts = chartDays.map(d => {
      const key = d.toISOString().slice(0, 10);
      return state.completionHistory.filter(c => scopedTaskIds.has(c.taskId) && c.createdAt.slice(0, 10) === key).length;
    });
    const maxDay = Math.max(1, ...dayCounts);
    const totalCompletedRecently = dayCounts.reduce((a,b) => a+b, 0);

    content().innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="stat-num">${activeProjects.length}</div><div class="stat-label">Active projects</div></div>
        <div class="stat-card"><div class="stat-num">${dueThisWeek.length}</div><div class="stat-label">Tasks due this week</div></div>
        <div class="stat-card"><div class="stat-num" style="color:${overdue.length ? 'var(--coral)' : 'var(--ink)'}">${overdue.length}</div><div class="stat-label">Overdue</div></div>
        <div class="stat-card"><div class="stat-num" style="color:${unassignedTasks.length ? 'var(--amber)' : 'var(--ink)'}">${unassignedTasks.length}</div><div class="stat-label">Unassigned tasks</div></div>
        <div class="stat-card"><div class="stat-num">${projects.length}</div><div class="stat-label">Total projects</div></div>
      </div>

      <div class="panel" style="margin-bottom:18px;border-color:${riskyProjects.length ? 'var(--amber)' : 'var(--line)'};">
        <h3>At risk</h3>
        ${riskyProjects.length ? riskyProjects.map(({project, reasons}) => `
          <div class="list-row" style="align-items:flex-start;">
            <span style="cursor:pointer;" data-action="goto-risk-project" data-id="${project.id}">${escapeHtml(project.name)}</span>
            <span style="text-align:right;">${reasons.map(r => `<div style="font-size:11px;color:var(--amber);">${escapeHtml(r)}</div>`).join("")}</span>
          </div>`).join("") : `<div class="empty-state">Nothing flagged — everything's tracking on schedule.</div>`}
      </div>

      <div class="grid-2">
        <div style="display:flex;flex-direction:column;gap:18px;">
          <div class="panel"><h3>Past deadlines</h3>
            ${pastDeadlines.length ? pastDeadlines.map(t => `<div class="list-row"><span style="cursor:pointer;" data-action="goto-task" data-id="${t.id}" data-project="${t.projectIds[0]||''}">${escapeHtml(t.title)}</span><span class="${dueDateClass(t.dueDate, t.status)}" style="font-size:12px;">${fmtDate(t.dueDate)}</span></div>`).join("") : `<div class="empty-state">Nothing overdue.</div>`}
          </div>
          <div class="panel"><h3>Upcoming deadlines</h3>
            ${upcomingDeadlines.length ? upcomingDeadlines.map(t => `<div class="list-row"><span style="cursor:pointer;" data-action="goto-task" data-id="${t.id}" data-project="${t.projectIds[0]||''}">${escapeHtml(t.title)}</span><span class="${dueDateClass(t.dueDate, t.status)}" style="font-size:12px;">${fmtDate(t.dueDate)}</span></div>`).join("") : `<div class="empty-state">Nothing due in the next 7 days.</div>`}
          </div>
          <div class="panel"><h3>Blocked tasks</h3>
            ${blockedTasks.length ? blockedTasks.slice(0,6).map(t => `<div class="list-row"><span style="cursor:pointer;" data-action="goto-task" data-id="${t.id}" data-project="${t.projectIds[0]||''}">${escapeHtml(t.title)}</span><span style="font-size:11px;color:var(--ink-faint);">waiting on a dependency</span></div>`).join("") : `<div class="empty-state">Nothing blocked.</div>`}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:18px;">
          <div class="panel">
            <h3>This month, overall</h3>
            <div class="arc-wrap" style="justify-content:center;margin:14px 0 22px 0;">
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="48" fill="none" stroke="var(--line)" stroke-width="10"/>
                <circle cx="60" cy="60" r="48" fill="none" stroke="var(--teal)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 60 60)"/>
              </svg>
              <div><div class="arc-num" style="font-size:38px;">${overallProgress}%</div><div class="arc-caption" style="max-width:150px;">${progressCaption}</div></div>
            </div>
            <div>
              <div style="font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Tasks by status <span style="text-transform:none;letter-spacing:0;">(click to browse)</span></div>
              ${TASK_COLS.map(c => `<div class="list-row" style="cursor:pointer;" data-action="browse-status" data-status="${c.key}"><span>${c.label}</span><span style="font-weight:500;">${statusCounts[c.key]}</span></div>`).join("")}
            </div>
          </div>
          <div class="panel"><h3>Launching soon</h3>
            ${launchingSoon.length ? launchingSoon.map(p => `<div class="list-row"><span style="cursor:pointer;" data-action="goto-risk-project" data-id="${p.id}">${escapeHtml(p.name)}</span><span class="${dueDateClass(p.endDate, p.status==='launched'?'done':'todo')}" style="font-size:12px;">${fmtDate(p.endDate)}</span></div>`).join("") : `<div class="empty-state">Nothing launching in the next 2 weeks.</div>`}
          </div>
        </div>
      </div>
      <div class="grid-2" style="margin-top:18px;">
        <div class="panel"><h3>${workloadTitle} <span style="font-weight:400;color:var(--ink-faint);">(click a name to browse)</span></h3>
          ${workloadRows.length ? workloadRows.map(([name, hrs]) => `<div class="list-row" style="${name!=='Unassigned'?'cursor:pointer;':''}" data-action="browse-assignee" data-name="${escapeHtml(name)}"><span class="assignee-chip"><span class="identity-dot" style="width:18px;height:18px;font-size:9px;background:${colorForName(name)}">${initials(name)}</span>${escapeHtml(name)}</span><span>${hrs}h open</span></div>`).join("") : `<div class="empty-state">No hours logged yet.</div>`}
        </div>
        <div class="panel">
          <h3>Completed, last 14 days ${totalCompletedRecently ? `<span style="font-weight:400;color:var(--ink-faint);">(${totalCompletedRecently} total)</span>` : ""}</h3>
          <svg viewBox="0 0 280 90" style="width:100%;height:100px;margin-top:8px;" preserveAspectRatio="none">
            ${dayCounts.map((c,i) => {
              const slot = 280/14; const barW = slot - 4; const x = i*slot + 2;
              const h = maxDay ? Math.max(c ? 3 : 0, (c/maxDay)*68) : 0; const y = 78 - h;
              return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="2" fill="${c ? 'var(--teal)' : 'var(--line)'}"><title>${chartDays[i].toLocaleDateString(undefined,{month:'short',day:'numeric'})}: ${c} completed</title></rect>`;
            }).join("")}
            <line x1="0" y1="78" x2="280" y2="78" stroke="var(--line)" stroke-width="1"/>
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:4px;"><span>${chartDays[0].toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span>${chartDays[13].toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>
        </div>
      </div>`;
    content().querySelectorAll('[data-action="goto-risk-project"]').forEach(el2 => el2.addEventListener("click", () => { state.selectedProjectId = el2.dataset.id; render(); }));
    content().querySelectorAll('[data-action="goto-task"]').forEach(el2 => el2.addEventListener("click", () => goToTask(el2.dataset.id, el2.dataset.project)));
    content().querySelectorAll('[data-action="browse-status"]').forEach(el2 => el2.addEventListener("click", () => browseByStatus(el2.dataset.status)));
    content().querySelectorAll('[data-action="browse-assignee"]').forEach(el2 => el2.addEventListener("click", () => browseByAssignee(el2.dataset.name)));
  }

            ${state.portfolios.filter(f => !p.portfolioIds.includes(f.id)).length ? `<select class="add-to-portfolio-inline" data-pid="${p.id}" style="font-size:11.5px;max-width:100%;"><option value="" selected disabled>+ Add to portfolio</option>${state.portfolios.filter(f => !p.portfolioIds.includes(f.id)).map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join("")}</select>` : ""}

    </div>`;
    content().querySelectorAll(".add-to-portfolio-inline").forEach(sel => {
      sel.addEventListener("click", (e) => e.stopPropagation());
      sel.addEventListener("change", (e) => { e.stopPropagation(); if (e.target.value) addProjectToPortfolio(e.target.dataset.pid, e.target.value); });

    content().querySelectorAll(".remove-from-portfolio-inline").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); removeProjectFromPortfolio(btn.dataset.pid, btn.dataset.fid); });

    content().querySelectorAll(".project-card").forEach(card => {
      card.addEventListener("click", () => { state.selectedProjectId = card.dataset.id; render(); });

    content().querySelectorAll(".task-reassign-select").forEach(s => s.addEventListener("change", (e) => setAssignee(e.target.dataset.id, e.target.value)));
    content().querySelectorAll('[data-action="open-task"]').forEach(btn => btn.addEventListener("click", () => openTaskDetail(btn.dataset.id)));

    content().querySelectorAll(".task-card").forEach(card => {
      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", card.dataset.taskId);

  function renderTimeline() {

    const ends = state.projects.map(p => new Date(p.endDate));
    const minDate = new Date(Math.min(...starts)), maxDate = new Date(Math.max(...ends));
    const totalSpan = Math.max(1, maxDate - minDate);
    const statusColor = { planning: "var(--ink-faint)", active: "var(--teal)", review: "var(--amber)", launched: "var(--sage)" };
    content().innerHTML = `<div class="panel">
      <div class="axis-row"><div></div><div class="axis-labels"><span>${fmtDate(minDate.toISOString().slice(0,10))}</span><span>${fmtDate(maxDate.toISOString().slice(0,10))}</span></div></div>
      ${state.projects.map(p => { const s = new Date(p.startDate), e = new Date(p.endDate); const left = ((s - minDate) / totalSpan) * 100; const width = Math.max(4, ((e - s) / totalSpan) * 100); return `
        <div class="timeline-row"><div><div style="font-weight:500;">${escapeHtml(p.name)}</div><span class="tag ${TEAM_CLASS[p.team] || ''}" style="margin-top:4px;">${p.team}</span></div>

  function attachMentionAutocomplete(textarea) {
    let dropdown = null;
    function removeDropdown() { if (dropdown) { dropdown.remove(); dropdown = null; } }
    function getActiveQuery() {
      const caret = textarea.selectionStart;
      const match = textarea.value.slice(0, caret).match(/(?:^|\s)@([A-Za-z]*)$/);
      return match ? match[1] : null;
    }
    function insertMention(name) {
      const caret = textarea.selectionStart;
      const rest = textarea.value.slice(caret);
      const replaced = textarea.value.slice(0, caret).replace(/@([A-Za-z]*)$/, "@" + name + " ");
      textarea.value = replaced + rest;
      textarea.focus(); textarea.setSelectionRange(replaced.length, replaced.length);
      removeDropdown();
    }
    textarea.addEventListener("input", () => {
      const query = getActiveQuery();
      if (query === null) { removeDropdown(); return; }
      const matches = state.people.filter(p => p.name.toLowerCase().startsWith(query.toLowerCase())).slice(0, 5);
      if (!matches.length) { removeDropdown(); return; }
      if (!dropdown) { dropdown = document.createElement("div"); dropdown.className = "mention-dropdown"; textarea.parentElement.appendChild(dropdown); dropdown.style.left = "0px"; dropdown.style.top = (textarea.offsetTop + textarea.offsetHeight + 4) + "px"; }
      dropdown.innerHTML = matches.map(p => `<div class="mention-option" data-name="${p.name}"><span class="identity-dot" style="width:18px;height:18px;font-size:8px;background:${colorForName(p.name)}">${initials(p.name)}</span>${escapeHtml(p.name)}</div>`).join("");
      dropdown.querySelectorAll(".mention-option").forEach(opt => opt.addEventListener("mousedown", (e) => { e.preventDefault(); insertMention(opt.dataset.name); }));
    });
    textarea.addEventListener("keydown", (e) => { if (e.key === "Escape") removeDropdown(); });
    textarea.addEventListener("blur", () => setTimeout(removeDropdown, 150));
  }

  // =========================================================
  // RESOURCING: time logging, BU meetings, planned vs actual
  // =========================================================
  const BUS = ["Education", "Planning Center", "Delight", "Corporate"];
  const BU_TARGET = { "Education": 0.7, "Planning Center": 0.3 };
  const BU_TAG = { "Education": "tag-team-education", "Planning Center": "tag-team-planning", "Delight": "tag-team-delight", "Corporate": "tag-team-corporate" };
  const MEETING_SERIES = {
    "Education": { start: "2026-10-22", every: 14, with: "Carlos", how: "in person, 13:00" },
    "Planning Center": { start: "2026-10-22", every: 28, with: "JJ", how: "Google Meet, 16:00 Madrid / 10:00 Miami" }
  };
  const FIRST_PERIOD_START = "2026-09-28"; // first week in the Marketing time log workbook
  const UNPLANNED_LABEL = { logged: "Logged for next meeting", urgent_swap: "Urgent, swapped in", accepted: "Accepted into plan", declined: "Declined" };

  const rollup = (bu) => bu === "Delight" ? "Planning Center" : bu;
  const buMembers = (bu) => bu === "Planning Center" ? ["Planning Center", "Delight"] : [bu];
  function localIso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function todayIso() { return localIso(new Date()); }
  function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return localIso(d); }
  function mondayOf(s) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return localIso(d); }
  function fmtLong(s) { return new Date(s + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }); }
  function fmtShort(s) { return new Date(s + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  function fmtH(h) { return (Math.round((Number(h) || 0) * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 }) + "h"; }
  const pct = (x) => Math.round(x * 100) + "%";

  function canSeeResourcing() { return !!me && (me.isAdmin || !!me.resBu); }
  function countedIds() { return new Set(state.people.filter(p => p.counts_in_capacity).map(p => p.id)); }

  function meetingSchedule(bu) {
    const s = MEETING_SERIES[bu], out = [], until = addDays(todayIso(), 180);
    let d = s.start;
    while (d <= until) { out.push(d); d = addDays(d, s.every); }
    return out;
  }
  function periodFor(bu, date) {
    const list = meetingSchedule(bu), i = list.indexOf(date);
    const next = list[i + 1] || addDays(date, MEETING_SERIES[bu].every);
    return { start: i <= 0 ? FIRST_PERIOD_START : list[i - 1], end: addDays(date, -1), nextStart: date, nextEnd: addDays(next, -1), isFirst: i === 0 };
  }
  function defaultMeeting(bu) { const t = todayIso(), list = meetingSchedule(bu); return list.find(d => d >= t) || list[list.length - 1]; }

  function entryLabel(e) {
    const t = e.task_id && state.tasks.find(t => t.id === e.task_id);
    const p = e.project_id && state.projects.find(p => p.id === e.project_id);
    if (t && p) return `${p.name}: ${t.title}`;
    if (p) return p.name + (e.label ? `: ${e.label}` : "");
    return e.label || "No project";
  }

  // ---------- loading ----------
  async function fetchAll(makeQuery) {
    let from = 0, out = [];
    for (;;) {
      const { data, error } = await makeQuery().range(from, from + 999);
      if (error || !data) break;
      out = out.concat(data);
      if (data.length < 1000) break;
      from += 1000;
    }
    return out;
  }
  async function loadTimeEntries() {
    state.timeEntries = await fetchAll(() => sb.from("time_entries").select("*").order("entry_date"));
    state.resTotalsCache = {};
  }
  async function loadResourcingMeta() {
    if (!canSeeResourcing()) return;
    const [m, i] = await Promise.all([
      sb.from("resourcing_meetings").select("*"),
      sb.from("resourcing_items").select("*").order("created_at")
    ]);
    state.resMeetings = m.data || [];
    state.resItems = i.data || [];
    if (me.isAdmin) {
      const f = await sb.from("resourcing_flags").select("*").order("created_at", { ascending: false });
      state.resFlags = f.data || [];
    }
  }
  async function fetchTotals(start, end) {
    const key = start + "|" + end;
    if (state.resTotalsCache[key]) return state.resTotalsCache[key];
    const { data } = await sb.rpc("resourcing_totals", { p_start: start, p_end: end });
    const map = {};
    (data || []).forEach(r => { map[r.bucket] = Number(r.hours) || 0; });
    state.resTotalsCache[key] = map;
    return map;
  }

  // Re-render without wiping something the user is typing in
  let pendingRender = false;
  function safeRender() {
    const a = document.activeElement;
    if (a && content().contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { pendingRender = true; return; }
    render();
  }
  content().addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(safeRender, 50); } });

  function subscribeResourcing() {
    if (channels.resourcing) sb.removeChannel(channels.resourcing);
    const onTime = async () => {
      await loadTimeEntries();
      if (["time", "resourcing"].includes(state.view) && !state.selectedProjectId) safeRender();
      if (detailTaskId && el("#td-time-list")) renderTaskTime(detailTaskId);
    };
    const onMeta = async () => { await loadResourcingMeta(); if (state.view === "resourcing" && !state.selectedProjectId) safeRender(); };
    const onCap = async () => { await loadCapacityData(); if (state.view === "resourcing" && !state.selectedProjectId) safeRender(); };
    channels.resourcing = sb.channel("resourcing-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "time_entries" }, onTime)
      .on("postgres_changes", { event: "*", schema: "public", table: "resourcing_meetings" }, onMeta)
      .on("postgres_changes", { event: "*", schema: "public", table: "resourcing_items" }, onMeta)
      .on("postgres_changes", { event: "*", schema: "public", table: "resourcing_flags" }, onMeta)
      .on("postgres_changes", { event: "*", schema: "public", table: "time_off" }, onCap)
      .on("postgres_changes", { event: "*", schema: "public", table: "public_holidays" }, onCap)
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, () => { state.resCapCache = {}; })
      .subscribe();
  }

  async function bootResourcing() {
    el("#nav-resourcing").hidden = !canSeeResourcing();
    await Promise.all([loadTimeEntries(), loadResourcingMeta(), loadCapacityData()]);
    subscribeResourcing();
    if (["time", "resourcing"].includes(state.view)) render();
  }

  // ---------- writes ----------
  async function addTimeEntry(row) {
    const { error } = await sb.from("time_entries").insert({ person_id: me.id, created_by: me.id, source: "tool", ...row });
    if (error) { alert("Couldn't log that time: " + error.message); return false; }
    await loadTimeEntries();
    return true;
  }
  async function deleteTimeEntry(id) {
    await sb.from("time_entries").delete().eq("id", id);
    await loadTimeEntries();
  }
  async function ensureMeeting(bu, date) {
    let m = state.resMeetings.find(m => m.business_unit === bu && m.scheduled_for === date);
    if (m) return m;
    const { data } = await sb.from("resourcing_meetings").insert({ business_unit: bu, scheduled_for: date, held_on: date }).select().single();
    if (data) state.resMeetings.push(data);
    return data;
  }

  // =========================================================
  // MY TIME view
  // =========================================================
  function projectOptions(selectedId) {
    const withBu = state.projects.filter(p => p.businessUnit && p.unplannedStatus !== "declined")
      .sort((a, b) => (a.businessUnit + a.name).localeCompare(b.businessUnit + b.name));
    return `<option value="">No project</option>` + BUS.map(bu => {
      const list = withBu.filter(p => p.businessUnit === bu);
      return list.length ? `<optgroup label="${bu}">${list.map(p => `<option value="${p.id}" ${p.id === selectedId ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}</optgroup>` : "";
    }).join("");
  }

  function renderTime() {
    if (!state.timeWeek) state.timeWeek = mondayOf(todayIso());
    const week = state.timeWeek, weekEnd = addDays(week, 6);
    el("#page-title").textContent = "My time";
    el("#page-sub").textContent = `Week of ${fmtLong(week)}`;
    const wrap = el("#team-filter-wrap");
    wrap.style.display = "flex";
    wrap.innerHTML = `<button class="btn-ghost" id="tw-prev">Previous week</button><button class="btn-ghost" id="tw-today">This week</button><button class="btn-ghost" id="tw-next">Next week</button>`;
    wrap.querySelector("#tw-prev").addEventListener("click", () => { state.timeWeek = addDays(week, -7); render(); });
    wrap.querySelector("#tw-next").addEventListener("click", () => { state.timeWeek = addDays(week, 7); render(); });
    wrap.querySelector("#tw-today").addEventListener("click", () => { state.timeWeek = mondayOf(todayIso()); render(); });

    const mine = state.timeEntries.filter(e => e.person_id === me.id && e.entry_date >= week && e.entry_date <= weekEnd)
      .sort((a, b) => a.entry_date.localeCompare(b.entry_date) || a.created_at.localeCompare(b.created_at));
    const byBu = {};
    mine.forEach(e => { byBu[e.business_unit] = (byBu[e.business_unit] || 0) + Number(e.hours); });
    const total = mine.reduce((s, e) => s + Number(e.hours), 0);
    const defaultDate = todayIso() >= week && todayIso() <= weekEnd ? todayIso() : week;

    content().innerHTML = `
      <div class="res-stack">
        <div class="panel">
          <h3>Log time</h3>
          <div class="inline-form">
            <input type="date" id="lt-date" value="${defaultDate}" aria-label="Date" />
            <select id="lt-project" aria-label="Project" style="min-width:220px;">${projectOptions("")}</select>
            <select id="lt-task" aria-label="Task" style="min-width:180px;"><option value="">No specific task</option></select>
            <select id="lt-bu" aria-label="Business unit">${BUS.map(b => `<option>${b}</option>`).join("")}</select>
            <input type="number" id="lt-hours" min="0.25" max="24" step="0.25" placeholder="Hours" style="width:90px;" aria-label="Hours" />
            <input type="text" id="lt-notes" placeholder="Notes (optional)" style="flex:1;min-width:160px;" aria-label="Notes" />
            <button class="btn" id="lt-save">Log time</button>
          </div>
          <div class="res-note" style="margin-top:8px;">Hours are decimal: 1.5 is an hour and a half. The business unit follows the project you pick.</div>
        </div>
        <div class="panel">
          <h3>This week: ${fmtH(total)}</h3>
          ${Object.keys(byBu).length ? `<div class="chip-row" style="margin-bottom:12px;">${BUS.filter(b => byBu[b]).map(b => `<span class="tag ${BU_TAG[b]}">${b} ${fmtH(byBu[b])}</span>`).join(" ")}</div>` : ""}
          ${mine.length ? `<div class="table-scroll"><table class="res-table">
            <thead><tr><th>Day</th><th>Work</th><th>Business unit</th><th class="num">Hours</th><th>Notes</th><th></th></tr></thead>
            <tbody>${mine.map(e => `<tr>
              <td>${fmtShort(e.entry_date)}</td><td>${escapeHtml(entryLabel(e))}</td>
              <td><span class="tag ${BU_TAG[e.business_unit]}">${e.business_unit}</span></td>
              <td class="num">${fmtH(e.hours)}</td><td class="res-note">${escapeHtml(e.notes || "")}</td>
              <td><button class="btn-text" data-del="${e.id}">Remove</button></td></tr>`).join("")}</tbody></table></div>`
            : `<div class="empty-state">Nothing logged this week yet. Add your first entry above.</div>`}
        </div>
      </div>`;

    const projSel = el("#lt-project"), taskSel = el("#lt-task"), buSel = el("#lt-bu");
    const syncProject = () => {
      const p = state.projects.find(p => p.id === projSel.value);
      const tasks = p ? state.tasks.filter(t => t.projectIds.includes(p.id)) : [];
      taskSel.innerHTML = `<option value="">No specific task</option>` + tasks.map(t => `<option value="${t.id}">${escapeHtml(t.title)}</option>`).join("");
      taskSel.disabled = !p;
      if (p && p.businessUnit) { buSel.value = p.businessUnit; buSel.disabled = true; } else buSel.disabled = false;
    };
    projSel.addEventListener("change", syncProject);
    syncProject();
    el("#lt-save").addEventListener("click", async () => {
      const hours = Number(el("#lt-hours").value);
      const date = el("#lt-date").value;
      if (!date || !(hours > 0 && hours <= 24)) { alert("Add a date and between 0 and 24 hours."); return; }
      const ok = await addTimeEntry({ entry_date: date, hours, business_unit: buSel.value, project_id: projSel.value || null, task_id: taskSel.value || null, notes: el("#lt-notes").value.trim() || null });
      if (ok) render();
    });
    content().querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => { if (confirm("Remove this entry?")) { await deleteTimeEntry(b.dataset.del); render(); } }));
  }

  // Time section inside the task panel
  function renderTaskTime(taskId) {
    const box = el("#td-time");
    if (!box) return;
    const task = state.tasks.find(t => t.id === taskId);
    const proj = task && task.projectIds.map(id => state.projects.find(p => p.id === id)).find(p => p && p.businessUnit);
    const entries = state.timeEntries.filter(e => e.task_id === taskId).sort((a, b) => b.entry_date.localeCompare(a.entry_date));
    const total = entries.reduce((s, e) => s + Number(e.hours), 0);
    box.innerHTML = `
      <div class="section-label"><span>Time logged</span><span>${fmtH(total)}${task && task.estimatedHours ? ` of ${fmtH(task.estimatedHours)} estimated` : ""}</span></div>
      <div id="td-time-list">${entries.map(e => {
        const who = (personById(e.person_id) || {}).name || "Someone";
        const mineOrAdmin = e.person_id === me.id || me.isAdmin;
        return `<div class="list-row"><span>${escapeHtml(who)}, ${fmtShort(e.entry_date)}${e.notes ? ` <span class="res-note">${escapeHtml(e.notes)}</span>` : ""}</span><span>${fmtH(e.hours)}${mineOrAdmin ? ` <button class="btn-text" data-tdel="${e.id}">Remove</button>` : ""}</span></div>`;
      }).join("")}</div>
      <div class="inline-form" style="margin:8px 0 20px 0;">
        <input type="date" id="tt-date" value="${todayIso()}" aria-label="Date" />
        <input type="number" id="tt-hours" min="0.25" max="24" step="0.25" placeholder="Hours" style="width:80px;" aria-label="Hours" />
        ${proj ? "" : `<select id="tt-bu" aria-label="Business unit">${BUS.map(b => `<option>${b}</option>`).join("")}</select>`}
        <input type="text" id="tt-notes" placeholder="Notes (optional)" style="flex:1;min-width:120px;" aria-label="Notes" />
        <button class="btn-ghost" id="tt-save">Log time</button>
      </div>
      ${proj ? "" : `<div class="res-note" style="margin:-14px 0 20px 0;">This task's project has no business unit yet, so pick one.</div>`}`;
    box.querySelectorAll("[data-tdel]").forEach(b => b.addEventListener("click", async () => { if (confirm("Remove this entry?")) { await deleteTimeEntry(b.dataset.tdel); renderTaskTime(taskId); } }));
    el("#tt-save").addEventListener("click", async () => {
      const hours = Number(el("#tt-hours").value), date = el("#tt-date").value;
      if (!date || !(hours > 0 && hours <= 24)) { alert("Add a date and between 0 and 24 hours."); return; }
      const ok = await addTimeEntry({
        entry_date: date, hours, task_id: taskId, project_id: proj ? proj.id : (task.projectIds[0] || null),
        business_unit: proj ? proj.businessUnit : el("#tt-bu").value, notes: el("#tt-notes").value.trim() || null
      });
      if (ok) renderTaskTime(taskId);
    });
  }

  // =========================================================
  // RESOURCING view
  // =========================================================
  function renderResourcing() {
    if (!canSeeResourcing()) { setView("dashboard"); return; }
    const bu = me.isAdmin ? (state.resBu || "Education") : me.resBu;
    state.resBu = bu;
    const series = MEETING_SERIES[bu], schedule = meetingSchedule(bu);
    if (!state.resMeetingDate || !schedule.includes(state.resMeetingDate)) state.resMeetingDate = defaultMeeting(bu);
    const date = state.resMeetingDate, per = periodFor(bu, date), today = todayIso();

    el("#page-title").textContent = `Resourcing: ${bu}`;
    el("#page-sub").textContent = `Meeting with ${series.with}, ${fmtLong(date)}, ${series.how}`;
    const wrap = el("#team-filter-wrap");
    wrap.style.display = "flex";
    const nextUp = defaultMeeting(bu);
    wrap.innerHTML = `
      ${me.isAdmin ? `<select id="res-bu" aria-label="Business unit">${Object.keys(MEETING_SERIES).map(b => `<option ${b === bu ? "selected" : ""}>${b}</option>`).join("")}</select>` : ""}
      <select id="res-date" aria-label="Meeting">${schedule.map(d => `<option value="${d}" ${d === date ? "selected" : ""}>${fmtLong(d)}${d === nextUp ? " (next)" : d < today ? " (past)" : ""}</option>`).join("")}</select>
      ${me.isAdmin ? `<button class="btn-ghost" id="res-import">Import workbook hours</button>` : `<button class="btn" id="res-request">Request work</button>`}`;
    if (me.isAdmin) {
      wrap.querySelector("#res-bu").addEventListener("change", (e) => { state.resBu = e.target.value; state.resMeetingDate = null; render(); });
      wrap.querySelector("#res-import").addEventListener("click", openImportModal);
    }
    wrap.querySelector("#res-date").addEventListener("change", (e) => { state.resMeetingDate = e.target.value; render(); });
    if (!me.isAdmin) wrap.querySelector("#res-request").addEventListener("click", () => openRequestModal(bu));

    const counted = countedIds();
    const members = buMembers(bu);
    const entriesBu = state.timeEntries.filter(e => counted.has(e.person_id) && members.includes(e.business_unit));
    const inPeriod = (e) => e.entry_date >= per.start && e.entry_date <= per.end;
    const campaigns = state.projects.filter(p => members.includes(p.businessUnit) && p.unplannedStatus !== "declined")
      .sort((a, b) => (a.priority || 999) - (b.priority || 999) || a.name.localeCompare(b.name));
    const hoursOf = (pid, onlyPeriod) => entriesBu.filter(e => e.project_id === pid && (!onlyPeriod || inPeriod(e))).reduce((s, e) => s + Number(e.hours), 0);

    // unlinked hours grouped by label
    const unlinked = {};
    entriesBu.filter(e => !e.project_id).forEach(e => {
      const k = e.label || "(no description)";
      unlinked[k] = unlinked[k] || { period: 0, all: 0 };
      unlinked[k].all += Number(e.hours);
      if (inPeriod(e)) unlinked[k].period += Number(e.hours);
    });

    const unplanned = state.projects.filter(p => members.includes(p.businessUnit) && p.isUnplanned)
      .sort((a, b) => (b.requestedOn || "").localeCompare(a.requestedOn || ""));
    const pipeline = campaigns.filter(p => p.status !== "launched" && (p.status === "planning" || ((p.startDate || "") <= per.nextEnd && (p.endDate || "9999") >= per.nextStart)))
      .sort((a, b) => (a.endDate || "").localeCompare(b.endDate || ""));

    const meeting = state.resMeetings.find(m => m.business_unit === bu && m.scheduled_for === date);

    const items = meeting ? state.resItems.filter(i => i.meeting_id === meeting.id) : [];
    const earlierMeetingIds = new Set(state.resMeetings.filter(m => m.business_unit === bu && m.scheduled_for < date).map(m => m.id));
    const carried = state.resItems.filter(i => i.kind === "action" && !i.done && earlierMeetingIds.has(i.meeting_id));
    const admin = me.isAdmin;

    const campaignRows = campaigns.map(p => {
      const period = hoursOf(p.id, true), all = hoursOf(p.id, false);
