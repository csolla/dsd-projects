        <td>${admin ? `<input type="number" min="1" class="res-prio" data-pid="${p.id}" value="${p.priority || ""}" aria-label="Priority" style="width:52px;" />` : (p.priority || "")}</td>

              const isNew = p.requestedOn && p.requestedOn >= per.start && p.requestedOn <= per.end;
              const swap = p.swappedFor && state.projects.find(x => x.id === p.swappedFor);
              return `<tr>
                <td style="max-width:340px;"><a href="#" data-open="${p.id}">${escapeHtml(p.name)}</a>${p.requestUrgent ? ` <span class="tag" style="background:var(--coral-soft);color:var(--coral);">Urgent</span>` : ""}${isNew ? ` <span class="tag tag-team-marketing">New this period</span>` : ""}${p.requestDetails ? `<div class="res-note" style="margin-top:3px;white-space:pre-wrap;">${escapeHtml(p.requestDetails)}</div>` : ""}</td>
                <td style="white-space:nowrap;">${p.requestedOn ? fmtShort(p.requestedOn) : "—"}${p.requestedBy ? `<div class="res-note">by ${escapeHtml((personById(p.requestedBy) || {}).name || "director")}</div>` : ""}</td>
                <td style="white-space:nowrap;">${p.requestDeadline ? fmtShort(p.requestDeadline) : "—"}</td>
                <td>${admin ? `<select class="res-ustatus" data-pid="${p.id}" style="width:auto;text-align:left;">${Object.keys(UNPLANNED_LABEL).map(k => `<option value="${k}" ${k === (p.unplannedStatus || "logged") ? "selected" : ""}>${UNPLANNED_LABEL[k]}</option>`).join("")}</select>` : UNPLANNED_LABEL[p.unplannedStatus || "logged"]}</td>
                <td>${admin && p.unplannedStatus === "urgent_swap" ? `<select class="res-swap" data-pid="${p.id}" style="width:auto;text-align:left;"><option value="">Choose…</option>${campaigns.filter(c => c.id !== p.id).map(c => `<option value="${c.id}" ${c.id === p.swappedFor ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}</select>` : (swap ? escapeHtml(swap.name) : "—")}</td>

        <div class="panel">
          <h3>5. Decisions and actions <span class="res-note">5 min</span></h3>
          ${meeting ? `
            ${admin ? `<div class="field"><label for="res-notes">Notes</label><textarea id="res-notes" rows="4" class="res-textarea">${escapeHtml(meeting.notes || "")}</textarea></div>`
              : (meeting.notes ? `<div class="res-notes-read">${escapeHtml(meeting.notes)}</div>` : "")}
            ${items.length ? items.map(i => `<div class="list-row">
              <span>${i.kind === "action" ? `<input type="checkbox" class="res-done" data-iid="${i.id}" ${i.done ? "checked" : ""} ${admin ? "" : "disabled"} aria-label="Done" /> ` : ""}<strong style="font-weight:500;">${i.kind === "decision" ? "Decision" : "Action"}:</strong> ${escapeHtml(i.text)}${i.owner ? ` <span class="res-note">(${escapeHtml(i.owner)}${i.due_date ? ", " + fmtShort(i.due_date) : ""})</span>` : ""}</span>
              ${admin ? `<button class="btn-text" data-idel="${i.id}">Remove</button>` : ""}</div>`).join("") : `<div class="res-note" style="margin-bottom:8px;">No decisions or actions recorded yet.</div>`}
            ${admin ? `<div class="inline-form" style="margin-top:10px;">
              <select id="ri-kind" aria-label="Type"><option value="decision">Decision</option><option value="action">Action</option></select>
              <input type="text" id="ri-text" placeholder="What was decided or needs doing" style="flex:1;min-width:200px;" aria-label="Text" />
              <input type="text" id="ri-owner" placeholder="Owner" style="width:110px;" aria-label="Owner" />

  // ---------- import from the Marketing time log workbook ----------
  function parseDelimited(text) {
    if (text.includes("\t")) return text.split(/\r?\n/).map(l => l.split("\t"));
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c !== "\r") cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function parseSheetDate(s) {
    s = (s || "").trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
  }
  function analyseImport(text) {
    const rows = parseDelimited(text);
    const hIdx = rows.findIndex(r => r.map(c => c.trim().toLowerCase()).includes("date") && r.map(c => c.trim().toLowerCase()).includes("team member"));
    if (hIdx < 0) return { error: "Couldn't find the header row. It needs the columns Date, Team member, Business unit, Project / task and Hours." };
    const head = rows[hIdx].map(c => c.trim().toLowerCase());
    const col = (n) => head.indexOf(n);
    const ci = { date: col("date"), person: col("team member"), bu: col("business unit"), label: col("project / task"), hours: col("hours"), notes: col("notes") };
    if ([ci.date, ci.person, ci.bu, ci.hours].some(i => i < 0)) return { error: "The header row is missing Date, Team member, Business unit or Hours." };
    const existing = new Set(state.timeEntries.filter(e => e.source === "import").map(e => [e.person_id, e.entry_date, e.business_unit, e.label || "", Number(e.hours)].join("|")));
    const ok = [], skipped = []; let dupes = 0;
    rows.slice(hIdx + 1).forEach((r, n) => {
      const get = (i) => i >= 0 ? (r[i] || "").trim() : "";
      if (!r.some(c => c && c.trim())) return;
      const line = hIdx + n + 2;
      const date = parseSheetDate(get(ci.date));
      const name = get(ci.person).toLowerCase();
      const person = state.people.find(p => { const pn = (p.name || "").toLowerCase(); return pn === name || pn.split(/\s+/)[0] === name; });
      const bu = BUS.find(b => b.toLowerCase() === get(ci.bu).toLowerCase());
      const hours = Number(get(ci.hours).replace(",", "."));
      const label = get(ci.label) || null;
      if (!date) return skipped.push(`Row ${line}: date "${get(ci.date)}" not recognised`);
      if (!person) return skipped.push(`Row ${line}: no staff member called "${get(ci.person)}"`);
      if (!bu) return skipped.push(`Row ${line}: business unit "${get(ci.bu)}" not recognised`);
      if (!(hours > 0 && hours <= 24)) return skipped.push(`Row ${line}: hours "${get(ci.hours)}" not between 0 and 24`);
      const key = [person.id, date, bu, label || "", hours].join("|");
      if (existing.has(key)) { dupes++; return; }
      existing.add(key);
      const proj = label && state.projects.find(p => p.name.toLowerCase() === label.toLowerCase());
      ok.push({ person_id: person.id, entry_date: date, business_unit: bu, hours, label, notes: get(ci.notes) || null, project_id: proj ? proj.id : null, source: "import", created_by: me.id });
    });
    return { ok, skipped, dupes };
  }
  function openImportModal() {
    const root = el("#modal-root");
    root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" style="width:520px;"><h3>Import workbook hours</h3>
      <p class="res-note">In the Marketing time log, open the Time log tab and either choose File, Download, CSV, or select the table including its header row and copy it. Then load or paste it here. Rows already imported are skipped.</p>
      <div class="field"><label for="im-file">CSV file</label><input id="im-file" type="file" accept=".csv,text/csv" /></div>
      <div class="field"><label for="im-text">Or paste the rows</label><textarea id="im-text" rows="6" class="res-textarea" placeholder="Date, Team member, Business unit, Project / task, Hours, Notes"></textarea></div>
      <div id="im-preview" class="res-note"></div>
      <div class="modal-actions"><button class="btn-ghost" id="im-cancel">Cancel</button><button class="btn" id="im-go" disabled>Import</button></div>
    </div></div>`;
    let result = null;
    const preview = () => {
      const text = el("#im-text").value;
      if (!text.trim()) { el("#im-preview").innerHTML = ""; el("#im-go").disabled = true; return; }
      result = analyseImport(text);
      if (result.error) { el("#im-preview").innerHTML = `<span class="res-flag-over">${escapeHtml(result.error)}</span>`; el("#im-go").disabled = true; return; }
      const linked = result.ok.filter(r => r.project_id).length;
      el("#im-preview").innerHTML = `${result.ok.length} rows ready (${linked} matched to a campaign by name, the rest can be linked from the Resourcing view). ${result.dupes ? result.dupes + " already imported. " : ""}${result.skipped.length ? `${result.skipped.length} skipped:<br>${result.skipped.slice(0, 8).map(escapeHtml).join("<br>")}${result.skipped.length > 8 ? "<br>…" : ""}` : ""}`;
      el("#im-go").disabled = !result.ok.length;
      el("#im-go").textContent = `Import ${result.ok.length} rows`;
    };
    el("#im-text").addEventListener("input", preview);
    el("#im-file").addEventListener("change", async (e) => { const f = e.target.files[0]; if (f) { el("#im-text").value = await f.text(); preview(); } });
    el("#modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") root.innerHTML = ""; });
    el("#im-cancel").addEventListener("click", () => root.innerHTML = "");
    el("#im-go").addEventListener("click", async () => {
      if (!result || !result.ok.length) return;
      el("#im-go").disabled = true; el("#im-go").textContent = "Importing…";
      for (let i = 0; i < result.ok.length; i += 200) {
        const { error } = await sb.from("time_entries").insert(result.ok.slice(i, i + 200));
        if (error) { el("#im-preview").innerHTML = `<span class="res-flag-over">Import stopped: ${escapeHtml(error.message)}</span>`; await loadTimeEntries(); return; }
      }
      await loadTimeEntries();
      root.innerHTML = "";
      render();
    });
  }

  // =========================================================
  // MONTHLY LIMITS + TEAM CAPACITY
  // =========================================================
  const CAPACITY_BUFFER = 0.8;          // 20% buffer, must match resourcing_month_capacity_raw
  const FIRST_LIMIT_MONTH = "2026-10-01";
  const HOLIDAY_REGIONS = ["Madrid", "England"];
  const monthStart = (s) => s.slice(0, 7) + "-01";
  function nextMonth(s) { const d = new Date(s.slice(0, 7) + "-01T00:00:00"); d.setMonth(d.getMonth() + 1); return localIso(d); }
  const monthEnd = (s) => addDays(nextMonth(monthStart(s)), -1);
  function fmtMonth(s) { return new Date(s + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
  function limitMonths() { const out = []; let m = FIRST_LIMIT_MONTH; const last = nextMonth(nextMonth(monthStart(todayIso()))); while (m <= last) { out.push(m); m = nextMonth(m); } return out; }

  async function loadCapacityData() {
    const h = await sb.from("public_holidays").select("*").order("holiday_date");
    state.holidays = h.data || [];
    if (me.isAdmin) { const t = await sb.from("time_off").select("*").order("off_date"); state.timeOff = t.data || []; }
    state.resCapCache = {};
  }
  async function fetchCapacity(month) {
    if (state.resCapCache[month] != null) return state.resCapCache[month];
    const { data } = await sb.rpc("resourcing_month_capacity", { p_month: month });
    state.resCapCache[month] = Number(data) || 0;
    return state.resCapCache[month];
  }

  // Same rule as the database: weekdays, minus bank holidays and time off
  function personMonthBreakdown(p, month) {
    const end = monthEnd(month), days = [], off = [];
    for (let d = month; d <= end; d = addDays(d, 1)) {
      const wd = new Date(d + "T00:00:00").getDay();
      if (wd === 0 || wd === 6) continue;
      const hol = state.holidays.find(h => h.region === p.holiday_region && h.holiday_date === d);
      const to = state.timeOff.find(t => t.person_id === p.id && t.off_date === d);
      if (hol) off.push({ date: d, kind: "holiday", label: hol.name });
      else if (to) off.push({ date: d, kind: "off", id: to.id, label: to.note || "Time off" });
      else days.push(d);
    }
    return { days: days.length, dayList: days, off, hours: days.length * (Number(p.daily_hours) || 0) };
  }

  function limitPanelHtml() {
    const months = limitMonths();
    if (!state.resMonth || !months.includes(state.resMonth)) state.resMonth = monthStart(todayIso());
    return `<div class="panel">
      <div class="section-label"><h3 style="margin:0;">Monthly limit</h3>
        <select id="res-month" aria-label="Month">${months.map(m => `<option value="${m}" ${m === state.resMonth ? "selected" : ""}>${fmtMonth(m)}</option>`).join("")}</select></div>
      <div id="res-limit"><div class="res-note">Loading…</div></div>
    </div>`;
  }
  function fillLimitPanel(bu) {
    const sel = el("#res-month");
    if (sel) sel.addEventListener("change", (e) => { state.resMonth = e.target.value; render(); });
    const month = state.resMonth;
    Promise.all([fetchCapacity(month), fetchTotals(month, monthEnd(month))]).then(([cap, totals]) => {
      const box = el("#res-limit");
      if (!box) return;
      if (!cap) { box.innerHTML = `<div class="res-note">No capacity set for ${fmtMonth(month)} yet.${me.isAdmin ? " Add hours a day in Team capacity below." : ""}</div>`; return; }
      const units = me.isAdmin ? ["Education", "Planning Center"] : [bu];
      box.innerHTML = units.map(b => {
        const limit = cap * BU_TARGET[b], used = totals[b] || 0, ratio = limit ? used / limit : 0;
        const status = ratio >= 1 ? ["Limit reached", "var(--coral)", "var(--coral-soft)"] : ratio >= 0.8 ? ["Warning: over 80%", "var(--amber)", "var(--amber-soft)"] : ["Within limit", "var(--teal)", "var(--teal-soft)"];
        return `<div class="alloc-row">
          <div><span class="tag ${BU_TAG[b]}">${b}</span></div>
          <div><div class="alloc-bar"><div class="alloc-fill" style="width:${Math.min(100, ratio * 100)}%;background:${status[1]};"></div><div class="alloc-target" style="left:80%;" title="80% warning"></div></div>
            <div class="res-note" style="margin-top:4px;">${fmtH(used)} used of ${fmtH(limit)}, ${fmtH(Math.max(0, limit - used))} left</div></div>
          <div style="text-align:right;"><span class="alloc-num">${pct(ratio)}</span> <span class="tag" style="background:${status[2]};color:${status[1]};">${status[0]}</span></div>
        </div>`;
      }).join("") + `<div class="res-note" style="margin-top:10px;">${fmtMonth(month)} capacity: ${fmtH(cap)} after a 20% buffer. Education gets 70% and Planning Center 30%; Corporate work uses up time without a limit of its own. The line on each bar marks 80%.</div>`;
    });
  }

  // ---------- admin: team capacity editor ----------
  function capacityPanelHtml() {
    const month = state.resMonth, end = monthEnd(month), today = todayIso();
    const counted = state.people.filter(p => p.counts_in_capacity);
    const shown = (p) => p.counts_in_capacity || (p.team || "").toLowerCase().includes("marketing") || p.daily_hours != null || (state.capExtra || []).includes(p.id);
    const listed = state.people.filter(p => p.role === "staff" && shown(p))
      .sort((a, b) => (b.counts_in_capacity - a.counts_in_capacity) || (a.name || "").localeCompare(b.name || ""));
    const rows = listed.map(p => ({ p, b: personMonthBreakdown(p, month) }));
    const gross = rows.filter(r => r.p.counts_in_capacity).reduce((s, r) => s + r.b.hours, 0), net = Math.round(gross * CAPACITY_BUFFER * 10) / 10;
    const hols = state.holidays.filter(h => h.holiday_date >= month && h.holiday_date <= end);
    // logged vs available up to today (or the whole month if it's over)
    const upTo = today < end ? today : end;
    const loggedCell = (p) => {
      if (!p.counts_in_capacity || month > today) return `<span class="res-note">—</span>`;
      const availDays = personMonthBreakdown(p, month).dayList.filter(d => d <= upTo).length;
      const avail = availDays * (Number(p.daily_hours) || 0);
      const logged = state.timeEntries.filter(e => e.person_id === p.id && e.entry_date >= month && e.entry_date <= upTo).reduce((s, e) => s + Number(e.hours), 0);
      const ratio = avail ? logged / avail : 0;
      return `<span class="${avail && ratio < 0.8 ? "res-flag-over" : ""}">${fmtH(logged)} of ${fmtH(avail)}</span>${avail ? ` <span class="res-note">(${pct(ratio)})</span>` : ""}`;
    };
    return `<div class="panel">
      <h3>Team capacity: ${fmtMonth(month)}</h3>
      <div class="res-note" style="margin-bottom:10px;">Only you can see and edit this. Directors only see the resulting limits. Tick Counted for everyone whose hours make up the 70/30.</div>
      ${listed.length ? `<div class="table-scroll"><table class="res-table">
        <thead><tr><th>Counted</th><th>Person</th><th class="num">Hours a day</th><th>Bank holidays</th><th class="num">Working days</th><th>Days off this month</th><th class="num">Hours</th><th class="num" title="Hours logged so far this month vs the hours they were available, before the buffer">Logged so far</th></tr></thead>
        <tbody>${rows.map(({ p, b }) => `<tr style="${p.counts_in_capacity ? "" : "opacity:0.55;"}">
          <td><input type="checkbox" class="cap-counted" data-pid="${p.id}" ${p.counts_in_capacity ? "checked" : ""} aria-label="Count ${escapeHtml(p.name || "")} in capacity" style="width:auto;" /></td>
          <td>${escapeHtml(p.name || p.email || "")}</td>
          <td class="num"><input type="number" min="0" max="12" step="0.5" class="cap-daily" data-pid="${p.id}" value="${p.daily_hours != null ? p.daily_hours : ""}" aria-label="Hours a day for ${escapeHtml(p.name || "")}" /></td>
          <td><select class="cap-region" data-pid="${p.id}" style="width:auto;text-align:left;" aria-label="Bank holiday calendar"><option value="">None</option>${HOLIDAY_REGIONS.map(r => `<option ${r === p.holiday_region ? "selected" : ""}>${r}</option>`).join("")}</select></td>
          <td class="num">${p.counts_in_capacity ? b.days : "—"}</td>
          <td>${p.counts_in_capacity && b.off.length ? b.off.map(o => o.kind === "off"
              ? `<span class="tag tag-team-marketing" style="margin:2px;">${fmtShort(o.date)} <button class="btn-text cap-off-del" data-id="${o.id}" title="Remove" style="padding:0 0 0 4px;font-size:11px;">×</button></span>`
              : `<span class="tag tag-team-corporate" style="margin:2px;" title="${escapeHtml(o.label)}">${fmtShort(o.date)}</span>`).join("") : `<span class="res-note">${p.counts_in_capacity ? "None" : "—"}</span>`}</td>
          <td class="num">${p.counts_in_capacity ? fmtH(b.hours) : "—"}</td>
          <td class="num">${loggedCell(p)}</td></tr>`).join("")}
          <tr><td colspan="6">Total before buffer</td><td class="num">${fmtH(gross)}</td><td></td></tr>
          <tr><td colspan="6"><strong style="font-weight:500;">Capacity after 20% buffer</strong></td><td class="num"><strong style="font-weight:500;">${fmtH(net)}</strong></td><td></td></tr>
          <tr><td colspan="6">Education limit (70%)</td><td class="num">${fmtH(net * 0.7)}</td><td></td></tr>
          <tr><td colspan="6">Planning Center limit (30%)</td><td class="num">${fmtH(net * 0.3)}</td><td></td></tr>
        </tbody></table></div>
        <div class="res-note" style="margin:6px 0 16px 0;">Grey dates are bank holidays, amber dates are time off. "Logged so far" turns red below 80% of the hours someone was available this month, which usually means hours are missing.</div>`
        : `<div class="empty-state">No Marketing staff found. People appear here after their first sign-in.</div>`}
      <div class="inline-form" style="margin-bottom:16px;">
        <select id="cap-add-person" aria-label="Add someone to the table"><option value="">Add someone to this table…</option>${state.people.filter(p => p.role === "staff" && !shown(p)).sort((a, b) => (a.name || a.email || "").localeCompare(b.name || b.email || "")).map(p => `<option value="${p.id}">${escapeHtml(p.name || p.email || "")}</option>`).join("")}</select>
        <span class="res-note">Anyone you add stays listed so you can tick Counted.</span>
      </div>

      <div class="section-label">Add time off</div>
      <div class="inline-form" style="margin-bottom:16px;">
        <select id="to-person" aria-label="Person">${counted.map(p => `<option value="${p.id}">${escapeHtml(p.name || p.email || "")}</option>`).join("")}</select>
        <input type="date" id="to-from" aria-label="From" />
        <input type="date" id="to-to" aria-label="To (optional)" title="Leave empty for a single day" />
        <input type="text" id="to-note" placeholder="Note, e.g. Holiday" style="flex:1;min-width:140px;" aria-label="Note" />
        <button class="btn-ghost" id="to-add">Add time off</button>
      </div>

      <div class="section-label">Bank holidays in ${fmtMonth(month)}</div>
      ${hols.length ? hols.map(h => `<div class="list-row"><span><span class="tag tag-team-corporate">${h.region}</span> ${fmtShort(h.holiday_date)}: ${escapeHtml(h.name)}</span><button class="btn-text cap-hol-del" data-region="${h.region}" data-date="${h.holiday_date}">Remove</button></div>`).join("") : `<div class="res-note" style="margin-bottom:8px;">None this month.</div>`}
      <div class="inline-form" style="margin-top:10px;">
        <select id="hol-region" aria-label="Calendar">${HOLIDAY_REGIONS.map(r => `<option>${r}</option>`).join("")}</select>
        <input type="date" id="hol-date" aria-label="Date" />
        <input type="text" id="hol-name" placeholder="Name" style="flex:1;min-width:140px;" aria-label="Holiday name" />
        <button class="btn-ghost" id="hol-add">Add bank holiday</button>
      </div>
    </div>`;
  }
  function bindCapacityPanel() {
    const after = async () => { await Promise.all([loadPeople(), loadCapacityData()]); state.resTotalsCache = {}; render(); };
    content().querySelectorAll(".cap-daily").forEach(i => i.addEventListener("change", async () => {
      const { error } = await sb.from("profiles").update({ daily_hours: i.value === "" ? null : Number(i.value) }).eq("id", i.dataset.pid);
      if (error) alert("Couldn't save: " + error.message); await after();
    }));
    content().querySelectorAll(".cap-region").forEach(s => s.addEventListener("change", async () => {
      const { error } = await sb.from("profiles").update({ holiday_region: s.value || null }).eq("id", s.dataset.pid);
      if (error) alert("Couldn't save: " + error.message); await after();
    }));
    const addSel = el("#cap-add-person");
    if (addSel) addSel.addEventListener("change", () => { if (!addSel.value) return; state.capExtra = (state.capExtra || []).concat(addSel.value); render(); });
    content().querySelectorAll(".cap-counted").forEach(c => c.addEventListener("change", async () => {
      if (!state.capExtra) state.capExtra = [];
      if (!state.capExtra.includes(c.dataset.pid)) state.capExtra.push(c.dataset.pid);
      const { error } = await sb.from("profiles").update({ counts_in_capacity: c.checked }).eq("id", c.dataset.pid);
      if (error) alert("Couldn't save: " + error.message); await after();
    }));
    content().querySelectorAll(".cap-off-del").forEach(b => b.addEventListener("click", async () => { await sb.from("time_off").delete().eq("id", b.dataset.id); await after(); }));
    content().querySelectorAll(".cap-hol-del").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("Remove this bank holiday?")) return;
      await sb.from("public_holidays").delete().eq("region", b.dataset.region).eq("holiday_date", b.dataset.date); await after();
    }));
    const toAdd = el("#to-add");
    if (toAdd) toAdd.addEventListener("click", async () => {
      const from = el("#to-from").value, to = el("#to-to").value || from, person = el("#to-person").value;
      if (!from || !person || to < from) { alert("Pick a person and a start date (and an end date on or after it)."); return; }
      const rows = [];
      for (let d = from; d <= to; d = addDays(d, 1)) {
        const wd = new Date(d + "T00:00:00").getDay();
        if (wd !== 0 && wd !== 6) rows.push({ person_id: person, off_date: d, note: el("#to-note").value.trim() || "Holiday" });
      }
      if (!rows.length) { alert("Those dates are all weekend days."); return; }
      const existing = new Set(state.timeOff.filter(t => t.person_id === person).map(t => t.off_date));
      const fresh = rows.filter(r => !existing.has(r.off_date));
      if (fresh.length) { const { error } = await sb.from("time_off").insert(fresh); if (error) alert("Couldn't save: " + error.message); }
      await after();
    });
    const holAdd = el("#hol-add");
    if (holAdd) holAdd.addEventListener("click", async () => {
      const date = el("#hol-date").value, name = el("#hol-name").value.trim();
      if (!date || !name) { alert("Add a date and a name."); return; }
      const { error } = await sb.from("public_holidays").insert({ region: el("#hol-region").value, holiday_date: date, name });
      if (error) alert("Couldn't save: " + error.message);
      await after();
    });
  }

  // ---------- directors: request work ----------
  function openRequestModal(bu) {
    const root = el("#modal-root");
    root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" style="width:460px;"><h3>Request work from Marketing</h3>
      <p class="res-note" style="margin-top:-4px;">Requests are reviewed at the next ${bu} meeting. Mark it urgent only if it can't wait until then.</p>
      <div class="field"><label for="rq-name">What do you need?</label><input id="rq-name" type="text" placeholder="e.g. Landing page for the March immersion" /></div>
      <div class="field"><label for="rq-details">Details</label><textarea id="rq-details" rows="4" class="res-textarea" placeholder="Goal, audience, what's included, links to briefs or files"></textarea></div>
      <div class="field"><label for="rq-deadline">Needed by</label><input id="rq-deadline" type="date" /></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);"><input type="checkbox" id="rq-urgent" /> Urgent: can't wait for the next meeting</label>
      <div id="rq-error" class="res-flag-over" style="font-size:12.5px;margin-top:8px;"></div>
      <div class="modal-actions"><button class="btn-ghost" id="rq-cancel">Cancel</button><button class="btn" id="rq-save">Send request</button></div>
    </div></div>`;
    el("#modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") root.innerHTML = ""; });
    el("#rq-cancel").addEventListener("click", () => root.innerHTML = "");
    el("#rq-save").addEventListener("click", async () => {
      const name = el("#rq-name").value.trim();
      if (!name) { el("#rq-error").textContent = "Add a short title for the request."; return; }
      el("#rq-save").disabled = true;
      const deadline = el("#rq-deadline").value || null;
      const res = await addProject({
        name, team: "Marketing", client: "", status: "planning", visibleToClient: false, portfolioIds: [],
        startDate: todayIso(), endDate: deadline || todayIso(), businessUnit: bu,
        isUnplanned: true, unplannedStatus: "logged", requestedOn: todayIso(),
        requestedBy: me.id, requestDetails: el("#rq-details").value.trim(), requestDeadline: deadline, requestUrgent: el("#rq-urgent").checked
      });
      if (res && res.error) { el("#rq-error").textContent = "Couldn't send the request: " + res.error.message; el("#rq-save").disabled = false; return; }
      root.innerHTML = "";
      await loadProjects();
      render();
    });
  }
})();
</script>
</body>
</html>
